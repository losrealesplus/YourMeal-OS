name: Migration Bootstrap Validation

# FOPEBA gate: every migration chain must apply cleanly on an empty database.
# Catches redefine-without-teardown conflicts (e.g. SQLSTATE 42710 on policies)
# before they reach a new Supabase project.
#
# Method: docs/10-validation/MIGRATION_BOOTSTRAP_VALIDATION.md

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: migration-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-preflight:
    name: Static policy teardown preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect CREATE POLICY collisions across migrations
        run: npm run test:migration-bootstrap:static

  empty-db-bootstrap:
    name: Empty DB · apply all migrations
    runs-on: ubuntu-latest
    needs: static-preflight
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The local schema owner supplies the restricted writer's auth USAGE.
      # postgres remains the ordinary CLI migrator; no grant option is added.
      # CI bootstrap is separate from the production four-file manifest.
      - name: Start and reset isolated DB with owner-authorized auth prerequisite
        run: node scripts/migration-bootstrap-ci.mjs
