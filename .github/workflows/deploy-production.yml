name: "Gate 7: Production Worker Deployment"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Normal preparation or exact one-time bootstrap"
        type: choice
        options: [normal, initial_activation]
        default: normal
      expected_base_sha:
        description: "Initial activation only: exact confirmed baseline SHA"
        type: string
      expected_target_sha:
        description: "Initial activation only: reconciled final main SHA"
        type: string
      authorized_prs:
        description: "Initial activation only: exact ordered JSON PR array"
        type: string
      authorization_id:
        description: "SHA-256 of canonical activation payload; scope identity, not production approval"
        type: string
      reason:
        description: "Reason for preparing an exact main release (not production approval)"
        required: true
        default: "Controlled production preparation"

permissions:
  contents: read
  actions: read
  deployments: read
  pull-requests: read

jobs:
  classify:
    name: "Classify outstanding main changes"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Classify exact source against authoritative publication baseline
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/governance/release-plan.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate7-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-plan.json
          if-no-files-found: warn
          retention-days: 7

  build:
    name: "Phase 1: Build Once & Cryptographic Digest"
    needs: classify
    if: needs.classify.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gate7-preparation-main
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.package.outputs.digest }}
      config_digest: ${{ steps.package.outputs.config_digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact approved-source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gate7-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Quality and governance validation
        run: |
          npm run typecheck
          npm run test:governance
          node --test scripts/governance/release-contract.spec.mjs scripts/governance/release-publication.spec.mjs scripts/governance/release-activation.spec.mjs scripts/governance/release-json.spec.mjs
      - name: Build exactly once
        run: npm run build
      - name: Immutable bundle, external manifest and digest
        id: package
        run: node scripts/governance/release-artifact.mjs package
      - name: Upload immutable artifact of this run/attempt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: production-worker-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/worker-dist.tar.gz
            artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish pre-approval identity
        env:
          DIGEST: ${{ steps.package.outputs.digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          printf '## AWAITING_PRODUCTION_APPROVAL\nSHA: `%s`\nArtifact ID: %s\nSHA-256: `%s`\nRun: %s / attempt %s\nMerge and CI do not authorize production.\n' "$GITHUB_SHA" "$ARTIFACT_ID" "$DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "Phase 2: Protected Production Deployment"
    needs: [classify, build]
    if: needs.classify.outputs.eligible == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-worker-publication
      cancel-in-progress: false
      queue: max
    environment:
      name: production-worker
      url: https://eatclean.yourmealos.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Initialize no-mutation ledger before artifact verification
        run: node scripts/governance/release-publish.mjs initialize
      - name: Download only the Phase 1 artifact ID from this run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: artifacts/
          merge-multiple: true
      - name: Verify pre-approval identity, bytes, config and safe archive
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
          EXPECTED_CONFIG_DIGEST: ${{ needs.build.outputs.config_digest }}
        run: node scripts/governance/release-artifact.mjs verify
      - name: Revalidate sovereign approval and publish exact version; read-only smoke
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
          EXPECTED_CONFIG_DIGEST: ${{ needs.build.outputs.config_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/governance/release-publish.mjs
      - name: Preserve publication ledger even if deployment or smoke fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate7-release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-report.json
          if-no-files-found: warn
          retention-days: 90
