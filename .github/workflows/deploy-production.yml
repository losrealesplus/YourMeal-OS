name: "Gate 7: Production Worker Deployment"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for production deployment"
        required: true
        default: "CR-GOV-01R production release"

permissions:
  contents: read

jobs:
  build:
    name: "Phase 1: Build Once & Cryptographic Digest"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code from Target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality & Governance Checks
        run: |
          npm run typecheck
          npm run test:governance

      - name: Compile Immutable Production Bundle
        run: npm run build

      - name: Package Artifact and Generate SHA-256 Digest
        id: package
        run: |
          mkdir -p .artifacts
          tar -czf .artifacts/worker-dist.tar.gz .output/
          cd .artifacts
          sha256sum worker-dist.tar.gz > digest.sha256
          echo "DIGEST=$(cat digest.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "Build Digest: $(cat digest.sha256)"

      - name: Upload Immutable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-worker-artifact
          path: .artifacts/
          retention-days: 7

  deploy:
    name: "Phase 2: Protected Production Deployment"
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-worker
      url: https://eatclean.yourmealos.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download Pre-Built Immutable Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-worker-artifact
          path: .artifacts/

      - name: Verify Cryptographic Digest (Build Once -> Deploy Exactly That)
        run: |
          cd .artifacts
          echo "Verifying artifact checksum against pre-approval digest..."
          sha256sum -c digest.sha256 || {
            echo "🚨 [SECURITY INTEGRITY FAILURE] Artifact checksum mismatch!"
            exit 1
          }
          echo "✅ Artifact checksum verified successfully."
          tar -xzf worker-dist.tar.gz -C ../

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Immutable Worker to Cloudflare Edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚨 [CREDENTIAL BLOCK] CLOUDFLARE_API_TOKEN is not configured in Environment secrets."
            exit 1
          fi
          npx wrangler deploy --config instances/yourmeal-eatclean/wrangler.prod.json --no-bundle
